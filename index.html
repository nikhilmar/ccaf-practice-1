<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#f6f7f4"/><meta name="description" content="A timed Claude Certified Architect Foundations practice exam."/><title>CCA-F Practice</title><link rel="stylesheet" href="./src/styles.css"/></head><body><div id="root"><div style="padding:20px;color:#384238;font:14px Arial">Loading practice app...</div></div><script>window.addEventListener('error',e=>{const el=document.getElementById('root');if(el)el.innerHTML='<pre style="padding:20px;color:#a33;white-space:pre-wrap">App load error: '+String(e.message||e.target?.src||'unknown')+'\n'+String(e.filename||'')+':'+String(e.lineno||'')+'\ntarget='+String(e.target?.src||'inline')+'</pre>'});window.addEventListener('unhandledrejection',e=>{const el=document.getElementById('root');if(el)el.innerHTML='<pre style="padding:20px;color:#a33;white-space:pre-wrap">App load error: '+String(e.reason?.message||e.reason)+'</pre>'})</script><script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="./src/db.js"></script>
<script type="text/babel" data-presets="env,react" src="./src/App.jsx"></script></body></html>
